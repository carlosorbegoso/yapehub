<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente corporativo -->
    <linearGradient id="corporateGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#673AB7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente para el centro Y -->
    <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF4081;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E91E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:1" />
    </radialGradient>
    
    <!-- Gradiente para conexiones -->
    <linearGradient id="connectionGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    
    <!-- Efectos -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo circular principal -->
  <circle cx="100" cy="100" r="90" fill="url(#corporateGradient)" filter="url(#dropShadow)"/>
  
  <!-- Círculos de vendedores (colaboradores) -->
  <g id="vendedores" opacity="0.8">
    <!-- Vendedor 1 - Top -->
    <circle cx="100" cy="35" r="15" fill="#4CAF50" stroke="white" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="15;18;15" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="40" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">V1</text>
    
    <!-- Vendedor 2 - Right -->
    <circle cx="165" cy="100" r="15" fill="#FF9800" stroke="white" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="15;18;15" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="165" y="105" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">V2</text>
    
    <!-- Vendedor 3 - Bottom Right -->
    <circle cx="135" cy="150" r="15" fill="#F44336" stroke="white" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="15;18;15" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="135" y="155" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">V3</text>
    
    <!-- Vendedor 4 - Bottom Left -->
    <circle cx="65" cy="150" r="15" fill="#9C27B0" stroke="white" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="15;18;15" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <text x="65" y="155" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">V4</text>
    
    <!-- Vendedor 5 - Left -->
    <circle cx="35" cy="100" r="15" fill="#607D8B" stroke="white" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="15;18;15" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="105" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">V5</text>
  </g>
  
  <!-- Líneas de conexión (representan SSE/notificaciones) -->
  <g id="connections" opacity="0.6">
    <line x1="100" y1="50" x2="100" y2="80" stroke="url(#connectionGradient)" stroke-width="3" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="100" x2="120" y2="100" stroke="url(#connectionGradient)" stroke-width="3" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="1s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="125" y1="135" x2="110" y2="120" stroke="url(#connectionGradient)" stroke-width="3" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="1s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="75" y1="135" x2="90" y2="120" stroke="url(#connectionGradient)" stroke-width="3" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="1s" begin="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="50" y1="100" x2="80" y2="100" stroke="url(#connectionGradient)" stroke-width="3" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="1s" begin="0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Y central (Admin/Hub) -->
  <g id="central-hub" filter="url(#dropShadow)">
    <circle cx="100" cy="100" r="25" fill="url(#centerGradient)" stroke="white" stroke-width="3"/>
    
    <!-- Letra Y -->
    <path d="M 88 88 L 94 88 L 100 98 L 106 88 L 112 88 L 104 104 L 104 112 L 96 112 L 96 104 Z" 
          fill="white" 
          stroke="rgba(255,255,255,0.8)" 
          stroke-width="1"/>
  </g>
  
  <!-- Indicadores de notificación (pulsos) -->
  <g id="notifications">
    <circle cx="100" cy="100" r="30" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" opacity="0">
      <animate attributeName="r" values="25;45;25" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="35" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" opacity="0">
      <animate attributeName="r" values="30;50;30" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Iconos de estado (dinero/confirmación) -->
  <g id="payment-icons" opacity="0.7">
    <!-- Símbolo de soles -->
    <text x="100" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">S/</text>
    
    <!-- Checkmark cuando se confirma -->
    <g transform="translate(115, 85)" opacity="0">
      <path d="M 0 2 L 3 5 L 8 0" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Texto corporativo -->
  <g transform="translate(100, 175)" text-anchor="middle">
    <text x="0" y="0" 
          font-family="'Segoe UI', Arial, sans-serif" 
          font-size="16" 
          font-weight="bold" 
          fill="white" 
          stroke="#1565C0" 
          stroke-width="1.5" 
          filter="url(#dropShadow)">YAPE</text>
  </g>
  
  <!-- Borde exterior corporativo -->
  <circle cx="100" cy="100" r="90" 
          fill="none" 
          stroke="rgba(255,255,255,0.3)" 
          stroke-width="2"/>
  <circle cx="100" cy="100" r="88" 
          fill="none" 
          stroke="rgba(255,255,255,0.1)" 
          stroke-width="1"/>
</svg>
